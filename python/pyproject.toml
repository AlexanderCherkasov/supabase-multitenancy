[build-system]
requires = ["setuptools>=77,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "supabase-multitenancy"
version = "0.2.0"
description = "Typed Python client for the supabase-tenant-rbac SQL package"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "supabase-tenant-rbac contributors" }]
dependencies = ["supabase>=2.18.1,<3"]
keywords = ["supabase", "postgres", "multitenancy", "rbac", "rls"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
